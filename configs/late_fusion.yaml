# Late fusion (Table III): MLP over the cached image + text softmax vectors.
# --- Architecture ---
num_classes: 101          # each input is a 101-d softmax, and the output is 101 logits
merge: concat             # concat | sum | max | weighted
hidden_dims: [256, 128]   # Linear(->256) -> ReLU -> Dropout -> Linear(256->128) -> ReLU -> Dropout
dropout: 0.2
alpha_logit_init: 0.0     # CHOICE: weighted mode starts at alpha = sigmoid(0) = 0.5 (no modality preferred)
shape_check_batch_size: 4

# --- Training (src/train_fusion.py) ---
features_dir: /ckpt/features   # {train,val,test}.pt from src/extract.py
optimizer: adam                # CHOICE: the paper gives no optimizer for the fusion MLP; same as the text model
lr: 0.001
scheduler: plateau
patience: 3                    # epochs without val improvement before lr *= factor
factor: 0.1
early_stopping: 8              # CHOICE: cheap model, stop after 8 epochs without val improvement
epochs: 50
batch_size: 256                # CHOICE: tiny inputs (2 x 101 floats), so large batches are fine
seed: 42
amp: false                     # runs on CPU: nothing to gain from float16
log_every: 0

model: late_fusion
merge: concat
optimizer: sgd
momentum: 0.9          # CHOICE
lr: 0.01
lr_schedule: [0.01, 0.001, 0.0001]   # paper, Section V
scheduler: plateau
patience: 2
epochs: 20             # paper's best was at epoch 5
batch_size: 256
dropout: 0.2
seed: 42